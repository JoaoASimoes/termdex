# GoReleaser configuration: https://goreleaser.com
# Used by .github/workflows/release.yml when a v* tag is pushed.
# Try it locally without publishing: goreleaser release --snapshot --clean
version: 2

project_name: termdex

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/termdex
    binary: termdex
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/config.example.toml
      - docs/*.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true # review the notes, then publish from the Releases page
