name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Keys, screens, what you would see… A sketch of the screen is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
