name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (echo "Run 'make fmt' on:"; gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Build
        run: go build -trimpath ./cmd/termdex

      - name: Check the example config
        if: runner.os == 'Linux'
        run: go run ./cmd/termdex --config configs/config.example.toml config check
